services:
  postgres:
    image: postgres:16-alpine
    container_name: bdsnowflake-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: petshop_dw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
      - ./исходные данные:/import_data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d petshop_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
